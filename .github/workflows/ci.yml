name: CI

on: push

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Constraints (no suppressions, no .env files)
        run: python scripts/check_suppressions.py $(git ls-files)
      - name: Lint (ruff + mypy)
        run: make lint BIN=
      - name: Tests with coverage (real Postgres 17 in Docker)
        run: make test BIN=
      - name: Migrations apply to a fresh Postgres (upgrade, downgrade, upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:55432/triagedesk_fresh
        run: |
          docker compose exec -T test-db psql -U postgres -c 'CREATE DATABASE triagedesk_fresh'
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Production compose file and Nginx config are valid
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
        run: |
          docker compose -f docker-compose.prod.yml config -q
          docker run --rm \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/triagedesk_proxy.conf:/etc/nginx/triagedesk_proxy.conf:ro" \
            nginxinc/nginx-unprivileged:1.29.8-alpine nginx -t
      - name: Dependency audit
        run: make audit BIN=
