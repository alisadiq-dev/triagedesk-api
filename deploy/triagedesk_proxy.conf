# Shared proxy settings for the API locations (included from nginx.conf).
set $api_upstream http://app:8000;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwrite, never append: a client-supplied X-Forwarded-For must not survive. The app trusts this
# header only from this container's fixed address (--forwarded-allow-ips).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# One id for the whole request: shows up in the nginx log and in the app's structured log.
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 3s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
