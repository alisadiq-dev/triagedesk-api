# Nginx in front of the API (local production setup, ADR 0005: plain http, no TLS).
# Mounted as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged (listens on 8080, not root).

# Access log without the query string ($uri, never $request or $request_uri): search terms stay out of the logs.
log_format triagedesk '$remote_addr "$request_method $uri" $status $body_bytes_sent '
                      '$request_time rid=$request_id';

server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout triagedesk;
    error_log /dev/stderr warn;

    # The app limits bodies too (64 KiB); this refuses them before they reach it.
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    large_client_header_buffers 4 8k;

    # Re-resolve the app by name through Docker's DNS, so a recreated container is found and nginx
    # starts even when the app is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Errors that nginx itself produces use the API's error format.
    error_page 413 = @payload_too_large;
    error_page 502 503 504 = @unavailable;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Request body is too large"}}';
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"not_ready","message":"The API is not reachable"}}';
    }

    # Only these paths reach the app. The interactive docs, /redoc and /openapi.json are never exposed.
    location = /health { include /etc/nginx/triagedesk_proxy.conf; }
    location = /ready { include /etc/nginx/triagedesk_proxy.conf; }
    location /api/v1/ { include /etc/nginx/triagedesk_proxy.conf; }

    location / {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        return 404 '{"error":{"code":"not_found","message":"Not found"}}';
    }
}
